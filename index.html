<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Learning Fun</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .letter-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            touch-action: manipulation;
        }
        
        .letter-card:active {
            transform: scale(0.9);
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .bounce {
            animation: bounce 0.5s ease;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .pulse-animation {
            animation: pulse 0.3s ease;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-400 via-pink-300 to-blue-300 min-h-screen">
    <!-- Header -->
    <div class="bg-gradient-to-r from-yellow-400 to-orange-400 shadow-lg sticky top-0 z-10">
        <div class="px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="text-4xl">🎓</div>
                    <div>
                        <h1 class="text-2xl font-black text-white drop-shadow-lg">ABC Learning</h1>
                        <p class="text-xs text-white/90 font-semibold">Tap to hear sounds!</p>
                    </div>
                </div>
                <button onclick="speakAll()" class="bg-white text-orange-500 px-4 py-2 rounded-full font-bold shadow-lg text-sm hover:bg-orange-50 active:scale-95 transition-transform">
                    🔊 Play All
                </button>
            </div>
        </div>
    </div>

    <!-- Alphabet Grid -->
    <div class="p-4 pb-20">
        <div id="alphabet-grid" class="grid grid-cols-3 gap-3 max-w-md mx-auto">
            <!-- Letters will be inserted here -->
        </div>
    </div>

    <!-- Footer -->
    <div class="fixed bottom-0 left-0 right-0 bg-gradient-to-r from-green-400 to-blue-400 shadow-lg">
        <div class="px-4 py-3 text-center">
            <p class="text-white font-bold text-sm">🌟 Keep Learning! You're doing great! 🌟</p>
        </div>
    </div>

    <script>
        const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
        const colors = [
            'from-red-400 to-red-500',
            'from-blue-400 to-blue-500',
            'from-green-400 to-green-500',
            'from-yellow-400 to-yellow-500',
            'from-purple-400 to-purple-500',
            'from-pink-400 to-pink-500',
            'from-indigo-400 to-indigo-500',
            'from-orange-400 to-orange-500',
            'from-teal-400 to-teal-500'
        ];

        const examples = {
            'A': '🍎 Apple', 'B': '🎈 Ball', 'C': '🐱 Cat', 'D': '🐶 Dog',
            'E': '🐘 Elephant', 'F': '🐸 Frog', 'G': '🍇 Grapes', 'H': '🏠 House',
            'I': '🍦 Ice Cream', 'J': '🤹 Juggle', 'K': '🔑 Key', 'L': '🦁 Lion',
            'M': '🐵 Monkey', 'N': '🎵 Note', 'O': '🐙 Octopus', 'P': '🍕 Pizza',
            'Q': '👑 Queen', 'R': '🚀 Rocket', 'S': '☀️ Sun', 'T': '🐯 Tiger',
            'U': '☂️ Umbrella', 'V': '🎻 Violin', 'W': '🐋 Whale', 'X': '📦 Box',
            'Y': '🧘 Yoga', 'Z': '🦓 Zebra'
        };

        function speak(letter) {
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesis();
                const word = examples[letter].split(' ')[1];
                
                // Speak the letter first
                const letterUtterance = new SpeechSynthesisUtterance(letter);
                letterUtterance.rate = 0.8;
                letterUtterance.pitch = 1.2;
                letterUtterance.volume = 1;
                
                // Then speak the word
                const wordUtterance = new SpeechSynthesisUtterance(`${letter} for ${word}`);
                wordUtterance.rate = 0.8;
                wordUtterance.pitch = 1.1;
                wordUtterance.volume = 1;
                
                window.speechSynthesis.speak(letterUtterance);
                
                letterUtterance.onend = () => {
                    setTimeout(() => {
                        window.speechSynthesis.speak(wordUtterance);
                    }, 200);
                };
                
                // Visual feedback
                const card = document.getElementById(`card-${letter}`);
                card.classList.add('pulse-animation');
                setTimeout(() => card.classList.remove('pulse-animation'), 300);
            } else {
                alert('Sorry! Your browser doesn\'t support speech synthesis.');
            }
        }

        function speakAll() {
            let index = 0;
            
            function speakNext() {
                if (index < alphabet.length) {
                    const letter = alphabet[index];
                    const card = document.getElementById(`card-${letter}`);
                    card.classList.add('bounce');
                    
                    speak(letter);
                    
                    setTimeout(() => {
                        card.classList.remove('bounce');
                    }, 500);
                    
                    index++;
                    setTimeout(speakNext, 2500);
                }
            }
            
            speakNext();
        }

        // Generate alphabet cards
        const grid = document.getElementById('alphabet-grid');
        alphabet.forEach((letter, index) => {
            const color = colors[index % colors.length];
            const example = examples[letter];
            
            const card = document.createElement('div');
            card.id = `card-${letter}`;
            card.className = `letter-card bg-gradient-to-br ${color} rounded-2xl shadow-xl p-4 cursor-pointer active:shadow-lg`;
            card.onclick = () => speak(letter);
            
            card.innerHTML = `
                <div class="text-center">
                    <div class="text-5xl font-black text-white drop-shadow-lg mb-2">${letter}</div>
                    <div class="text-xs font-bold text-white/90 leading-tight">${example}</div>
                </div>
            `;
            
            grid.appendChild(card);
        });

        // Prevent context menu on long press
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('SW registered'))
      .catch(err => console.error('SW error:', err));
  });
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  deferredPrompt = e;
});

window.installPWA = async function() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    return outcome;
  }
  return 'not_available';
};
</script>
</body>
</html>
